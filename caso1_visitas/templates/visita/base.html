<!doctype html>
<html lang="es">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Control de visitas{% endblock %}</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style type="text/tailwindcss">
        @theme {
            --font-sans: "Avenir Next", "Segoe UI", ui-sans-serif, system-ui, sans-serif;
        }

        @layer base {
            body {
                @apply min-h-screen font-sans text-slate-800 antialiased;
                background-image:
                    radial-gradient(circle at 8% 0%, rgba(251, 191, 36, .20), transparent 24rem),
                    radial-gradient(circle at 96% 18%, rgba(20, 184, 166, .18), transparent 27rem),
                    linear-gradient(135deg, #f8fafc 0%, #f0fdfa 52%, #fffbeb 100%);
                background-attachment: fixed;
            }
        }
    </style>
</head>

<body class="selection:bg-teal-200 selection:text-slate-950">
    <a href="#contenido" class="sr-only z-50 rounded-lg bg-slate-950 px-4 py-3 font-semibold text-white focus:not-sr-only focus:absolute focus:left-4 focus:top-4">Saltar al contenido</a>
    <header class="px-4 pt-4 sm:px-8 sm:pt-8">
        <nav aria-label="Navegación principal" class="mx-auto flex max-w-6xl items-center justify-between rounded-[1.25rem] border border-white/80 bg-white/75 px-3 py-3 shadow-[0_18px_50px_rgba(15,23,42,0.10)] backdrop-blur-xl sm:px-5">
            <a href="{% url 'visita_list' %}" class="flex items-center gap-3 rounded-xl px-2 py-1.5 font-semibold tracking-tight text-slate-950 transition hover:bg-white focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-teal-700">
                <span class="flex size-10 items-center justify-center rounded-xl bg-teal-700 text-white shadow-sm" aria-hidden="true">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" class="size-5"><path stroke-linecap="round" stroke-linejoin="round" d="M15 19.13a9 9 0 1 0-6 0M12 12a3.75 3.75 0 1 0 0-7.5A3.75 3.75 0 0 0 12 12Z" /><path stroke-linecap="round" stroke-linejoin="round" d="M19.5 8.25v4.5m2.25-2.25h-4.5" /></svg>
                </span>
                <span>Recepción <span class="text-teal-700">& visitas</span></span>
            </a>
            <div class="flex items-center gap-1 sm:gap-2">
                <a href="{% url 'visita_list' %}" class="inline-flex items-center gap-2 rounded-xl bg-teal-50 px-3 py-2 text-sm font-semibold text-teal-800 transition hover:bg-teal-100 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-teal-700">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" class="size-5" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M4.5 5.25h15v13.5h-15V5.25ZM8.25 9h7.5M8.25 12h7.5M8.25 15h4.5" /></svg>
                    <span class="hidden sm:inline">Visitas registradas</span>
                    <span class="sr-only sm:hidden">Visitas registradas</span>
                </a>
            </div>
        </nav>
    </header>
    <main id="contenido" class="mx-auto w-full max-w-6xl px-4 py-8 sm:px-8 sm:py-12">
        {% block content %}{% endblock %}
    </main>
    <footer class="mx-auto max-w-6xl px-4 pb-8 text-center text-sm text-slate-500 sm:px-8">
        {% block footer %}Registro de visitas{% endblock %}
    </footer>
</body>

</html>
